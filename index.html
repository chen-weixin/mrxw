<!DOCTYPE html>
<html lang="zh" data-composition-variables='[]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鑫观点市场前瞻</title>
  <link rel="stylesheet" href="tesla-news.css" />
</head>
<body>
  <div id="root"
    data-composition-id="main"
    data-width="1080"
    data-height="1920"
    data-start="0"
    data-duration="76"
  >
    <!-- 平滑渐变背景层 -->
    <div id="bg-layer" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#0A0C12;z-index:0;"></div>

    <!-- 场景容器 -->
    <div id="scenes-container" style="position:relative;width:100%;height:100%;z-index:1;">

      <!-- 开场 -->
      <div id="scene-hook"
        data-composition-id="scene-hook"
        data-composition-src="scenes/scene-hook.html"
        data-start="0"
        data-duration="5.96"
        data-track-index="1"
        style="position:absolute;top:0;left:0;width:100%;height:100%;"
      ></div>

      <!-- 新闻1 -->
      <div id="scene-n1"
        data-composition-id="scene-n1"
        data-composition-src="scenes/scene-n1.html"
        data-start="5.96"
        data-duration="18.99"
        data-track-index="1"
        style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;"
      ></div>

      <!-- 新闻2 -->
      <div id="scene-n2"
        data-composition-id="scene-n2"
        data-composition-src="scenes/scene-n2.html"
        data-start="24.95"
        data-duration="16.73"
        data-track-index="1"
        style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;"
      ></div>

      <!-- 新闻3 -->
      <div id="scene-n3"
        data-composition-id="scene-n3"
        data-composition-src="scenes/scene-n3.html"
        data-start="41.68"
        data-duration="15.58"
        data-track-index="1"
        style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;"
      ></div>

      <!-- 新闻4 -->
      <div id="scene-n4"
        data-composition-id="scene-n4"
        data-composition-src="scenes/scene-n4.html"
        data-start="57.26"
        data-duration="16.52"
        data-track-index="1"
        style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;"
      ></div>
    </div>

    <!-- 渐变遮罩（用于转场） -->
    <div id="transition-overlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#0A0C12;opacity:0;z-index:50;pointer-events:none;"></div>

  </div>

  <!-- 音频轨道 -->
  <audio id="a-hook"  data-start="0"    data-duration="5.96"  data-track-index="2" src="audio/hook.wav"  data-volume="1"></audio>
  <audio id="a-n1"    data-start="5.96"  data-duration="18.99" data-track-index="3" src="audio/news1.wav" data-volume="1"></audio>
  <audio id="a-n2"    data-start="24.95" data-duration="16.73" data-track-index="4" src="audio/news2.wav" data-volume="1"></audio>
  <audio id="a-n3"    data-start="41.68" data-duration="15.58" data-track-index="5" src="audio/news3.wav" data-volume="1"></audio>
  <audio id="a-n4"    data-start="57.26" data-duration="16.52" data-track-index="6" src="audio/news4.wav" data-volume="1"></audio>

  <script src="js/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    var rootTl = gsap.timeline({ paused: true });

    // ========== 平滑渐变转场 ==========

    // Hook → N1 转场 (在5.6s开始，持续0.4s)
    rootTl.to('#scene-hook', { opacity: 0, duration: 0.4, ease: 'power2.inOut' }, 5.6);
    rootTl.to('#scene-n1', { opacity: 1, duration: 0.4, ease: 'power2.inOut' }, 5.6);

    // N1 → N2 转场 (在24.5s开始)
    rootTl.to('#scene-n1', { opacity: 0, duration: 0.4, ease: 'power2.inOut' }, 24.5);
    rootTl.to('#scene-n2', { opacity: 1, duration: 0.4, ease: 'power2.inOut' }, 24.5);

    // N2 → N3 转场 (在41.2s开始)
    rootTl.to('#scene-n2', { opacity: 0, duration: 0.4, ease: 'power2.inOut' }, 41.2);
    rootTl.to('#scene-n3', { opacity: 1, duration: 0.4, ease: 'power2.inOut' }, 41.2);

    // N3 → N4 转场 (在56.8s开始)
    rootTl.to('#scene-n3', { opacity: 0, duration: 0.4, ease: 'power2.inOut' }, 56.8);
    rootTl.to('#scene-n4', { opacity: 1, duration: 0.4, ease: 'power2.inOut' }, 56.8);

    // 结尾淡出黑场
    rootTl.to('#scene-n4', { opacity: 0, duration: 1.0, ease: 'power2.in' }, 71.0);
    rootTl.to('#transition-overlay', { opacity: 1, duration: 1.0, ease: 'power2.in' }, 71.0);

    window.__timelines['main'] = rootTl;
  </script>
</body>
</html>
